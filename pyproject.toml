[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-queue"
version = "0.1.0"
description = "High-Performance Distributed Asynchronous Task Orchestrator & Job Engine"
readme = "README.md"
authors = [{ name = "Lazarus Ebi", email = "lazorronchain@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "rich>=13.0.0",
]

[project.scripts]
nexus = "nexus.cli:main"
